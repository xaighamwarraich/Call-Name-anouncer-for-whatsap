name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project zip
        run: |
          mkdir -p "$RUNNER_TEMP/proj"
          unzip -o -q ./*.zip -d "$RUNNER_TEMP/proj"
          find "$RUNNER_TEMP/proj" -name settings.gradle.kts -printf '%h\n' | head -1 > "$RUNNER_TEMP/dir.txt"
          read -r DIR < "$RUNNER_TEMP/dir.txt"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: call-announcer-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
