name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project zip
        run: |
          mkdir -p "$RUNNER_TEMP/proj"
          if ls ./*.zip >/dev/null 2>&1; then
            unzip -o -q "$(ls -t ./*.zip | head -1)" -d "$RUNNER_TEMP/proj"
          else
            cp -r . "$RUNNER_TEMP/proj"
          fi
          DIR=$(dirname "$(find "$RUNNER_TEMP/proj" -name settings.gradle.kts | head -
